<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YAWYA</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            background-color: #000;
            color: #fff;
            font-family: Favorit, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }
        
        .logo-container {
            width: 80%;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        
        .logo-container img {
            width: 100%;
            height: auto;
        }
        
        .email {
            position: absolute;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 12px;
            color: #666;
            text-decoration: none;
        }
        
        .email:hover {
            color: #999;
        }
    </style>
</head>
<body>
    <div class="logo-container">
        <img src="./assets/Logo_red.svg" alt="YAWYA">
    </div>
    
    <a href="mailto:contact@yawyastudio.com" class="email">contact@yawyastudio.com</a>
</body>
</html>
