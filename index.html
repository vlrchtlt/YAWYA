<!DOCTYPE html>

<style>
  /* Fond noir pur. Pour revenir au noir du site précédent : #0A0A0A */
  :root { --fond: #000000; }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; background: var(--fond); }
  body {
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    min-height: 100svh;
    padding: 8vmin;
    overflow: hidden;
  }
  .logo {
    display: block;
    width: min(58vw, 400px);
    height: auto;
    -webkit-user-drag: none;
    user-select: none;
  }
  @media (max-width: 520px) { .logo { width: 70vw; } }
