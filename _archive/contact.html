<!DOCTYPE html>
<html>
<head>
    <title>Contact Forms - YAWYA</title>
</head>
<body style="display: none;">
    <!-- Hidden forms for Netlify detection -->
    
    <form name="contact" netlify>
        <input type="text" name="name" />
        <input type="email" name="email" />
        <textarea name="message"></textarea>
        <input type="hidden" name="subject" value="Private Presentation Request - YAWYA" />
    </form>
    
    <form name="contact-fr" netlify>
        <input type="text" name="name" />

        <textarea name="message"></textarea>
        <input type="hidden" name="subject" value="Demande de Présentation Privée - YAWYA" />
    </form>
    
    <form name="contact-it" netlify>
        <input type="text" name="name" />
        <input type="email" name="email" />
        <textarea name="message"></textarea>
        <input type="hidden" name="subject" value="Richiesta Presentazione Privata - YAWYA" />
    </form>
</body>
</html>
